name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core — typecheck, unit tests, end-to-end replay eval (no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/trigger/package-lock.json
      - run: npm ci
      # The Trigger.dev worker is its own install root (keeps @trigger.dev/sdk out of the core);
      # its sources import the agent core, so both installs are needed to typecheck it.
      - run: npm ci --prefix packages/trigger
      - run: npm run typecheck
      - run: npm run typecheck:trigger
      - run: npm test
      # Full pipeline (extract → gate → price → draft → guards) over the golden set, replaying
      # recorded model responses: deterministic, offline, and the same gate as the live eval.
      - run: npm run eval:replay

  database:
    name: Database — migrations + SQL proofs on a fresh local Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - run: bash scripts/db-test-local.sh

  web:
    name: Web — typecheck + production build (Next.js dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # A real production build (catches server/client component errors typecheck cannot). The
      # public Supabase URL/key are placeholders: nothing is fetched at build time.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
